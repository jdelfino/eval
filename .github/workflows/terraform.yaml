name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yaml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yaml'
  workflow_dispatch:

env:
  TF_VERSION: '1.14'

jobs:
  check-terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive ../..
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # Module unit tests. Every run block is `command = plan` against empty
  # state, so no GCP API call is ever made — but the google provider still
  # refuses to *configure* without a credential, and would fail here with
  # "Attempted to load application default credentials". A placeholder token
  # satisfies provider configuration without granting access to anything.
  # Do not replace this with real credentials: these tests must not be able
  # to reach GCP.
  test-terraform-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [secrets, monitoring, gke, nat, dns-ssl]
    defaults:
      run:
        working-directory: infrastructure/terraform/modules/${{ matrix.module }}
    env:
      GOOGLE_OAUTH_ACCESS_TOKEN: placeholder-plan-only-no-api-calls
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Test
        run: terraform test
